<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Warm Daylight Radial Accent -->
    <radialGradient id="sunGlow" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Tone Gradient (Warm Ethiopian complexioned) -->
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#b07d58" />
      <stop offset="50%" stop-color="#9a6845" />
      <stop offset="100%" stop-color="#7d4e2f" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d4e2f" />
      <stop offset="100%" stop-color="#5e381e" />
    </linearGradient>

    <!-- Sweater Blue Gradient -->
    <linearGradient id="sweaterGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Sunglasses Glass Reflection Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e" />
      <stop offset="40%" stop-color="#18181b" />
      <stop offset="65%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Sunglass White Gleam -->
    <linearGradient id="glassGleam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Crown Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Certificate Border Pattern -->
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Mask Outer Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="60" />
  <circle cx="200" cy="180" r="190" fill="url(#sunGlow)" />

  <!-- Background decorative light particles -->
  <circle cx="70" cy="70" r="4" fill="#ffffff" opacity="0.3" />
  <circle cx="340" cy="90" r="5" fill="#ffffff" opacity="0.25" />
  <circle cx="310" cy="50" r="3" fill="#ffffff" opacity="0.4" />

  <!-- Torso & Sky-Blue School Uniform Sweater -->
  <g id="torso">
    <!-- Blue Sweater Body -->
    <path d="M 60 400 L 80 295 C 95 240, 140 220, 200 220 C 260 220, 305 240, 320 295 L 340 400 Z" fill="url(#sweaterGrad)" />

    <!-- Sweater Knit texture lines (subtle) -->
    <path d="M 120 280 C 160 295, 240 295, 280 280" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M 100 320 C 150 335, 250 335, 300 320" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4" />

    <!-- School Sweater Emblem (Left Chest Badge) -->
    <circle cx="140" cy="285" r="15" fill="#ffffff" opacity="0.85" />
    <circle cx="140" cy="285" r="12" fill="none" stroke="#0284c7" stroke-width="1.5" />
    <!-- Cross / School symbol -->
    <path d="M 140 276 L 140 294 M 134 282 L 146 282" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

    <!-- White Shirt Collar & V-Neck Opening -->
    <!-- Inner White Shirt -->
    <polygon points="175,220 225,220 200,265" fill="#ffffff" />
    <!-- White Shirt Pointed Left Collar -->
    <polygon points="170,215 150,245 190,240" fill="#ffffff" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.15))" />
    <!-- White Shirt Pointed Right Collar -->
    <polygon points="230,215 250,245 210,240" fill="#ffffff" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.15))" />

    <!-- Blue Sweater V-Neck Ribbed Border -->
    <path d="M 160 220 L 200 268 L 240 220 L 230 220 L 200 258 L 170 220 Z" fill="#0369a1" />
  </g>

  <!-- Neck -->
  <g id="neck">
    <path d="M 180 205 L 180 230 C 180 238, 220 238, 220 230 L 220 205 Z" fill="url(#skinShadow)" />
    <path d="M 182 205 L 182 225 C 182 232, 218 232, 218 225 L 218 205 Z" fill="url(#skinGrad)" />
  </g>

  <!-- Head, Hair & Ears -->
  <g id="head">
    <!-- Left Ear -->
    <path d="M 142 165 C 136 165, 134 180, 140 190 C 144 195, 148 190, 148 180 Z" fill="url(#skinGrad)" />
    <!-- Right Ear -->
    <path d="M 258 165 C 264 165, 266 180, 260 190 C 256 195, 252 190, 252 180 Z" fill="url(#skinGrad)" />

    <!-- Face Shape -->
    <path d="M 148 145 C 148 95, 252 95, 252 145 C 252 190, 235 220, 200 220 C 165 220, 148 190, 148 145 Z" fill="url(#skinGrad)" />

    <!-- Hair (Neat, modern fade crop) -->
    <path d="M 144 140 C 144 95, 155 75, 200 75 C 245 75, 256 95, 256 140 C 250 120, 240 100, 200 100 C 160 100, 150 120, 144 140 Z" fill="#18181b" />
    <path d="M 152 105 C 170 85, 230 85, 248 105 C 240 98, 225 90, 200 90 C 175 90, 160 98, 152 105 Z" fill="#27272a" />
  </g>

  <!-- Cheerful Smile & Facial Features -->
  <g id="face-details">
    <!-- Nose bridge & tip -->
    <path d="M 197 165 C 197 178, 192 182, 195 184 C 198 186, 202 186, 205 184 C 208 182, 203 178, 203 165" fill="#7d4e2f" opacity="0.6" />

    <!-- Warm Cheerful Smile (Lips & Teeth) -->
    <path d="M 180 195 C 188 208, 212 208, 220 195 Z" fill="#581c1c" />
    <!-- White Teeth -->
    <path d="M 183 196 C 189 202, 211 202, 217 196 C 213 195, 187 195, 183 196 Z" fill="#ffffff" />
    <!-- Bottom Lip -->
    <path d="M 185 200 C 193 205, 207 205, 215 200 C 207 202, 193 202, 185 200 Z" fill="#884040" />
  </g>

  <!-- Stylish Dark Sunglasses (The iconic feature) -->
  <g id="sunglasses" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.5))">
    <!-- Sunglasses Frame (Modern Wayfarer / Browline) -->
    <path d="M 152 145 C 152 140, 192 140, 196 148 L 204 148 C 208 140, 248 140, 248 145 C 248 152, 246 172, 238 174 C 220 178, 205 174, 202 162 L 198 162 C 195 174, 180 178, 162 174 C 154 172, 152 152, 152 145 Z" fill="#09090b" stroke="#18181b" stroke-width="2" />

    <!-- Left Lens (Purple / Black tint) -->
    <path d="M 156 147 C 158 143, 190 143, 193 149 C 191 168, 183 172, 165 170 C 157 169, 155 158, 156 147 Z" fill="url(#glassReflection)" />
    <!-- Left Lens Glossy Highlight -->
    <polygon points="160,147 182,147 168,168 158,168" fill="url(#glassGleam)" />

    <!-- Center Bridge -->
    <rect x="195" y="148" width="10" height="4" rx="2" fill="#27272a" />

    <!-- Right Lens (Purple / Black tint) -->
    <path d="M 207 149 C 210 143, 242 143, 244 147 C 245 158, 243 169, 235 170 C 217 172, 209 168, 207 149 Z" fill="url(#glassReflection)" />
    <!-- Right Lens Glossy Highlight -->
    <polygon points="211,147 233,147 219,168 209,168" fill="url(#glassGleam)" />
  </g>

  <!-- Held Certificate (School Achievement Award in foreground) -->
  <g id="certificate" filter="url(#cardShadow)">
    <!-- White Certificate Paper -->
    <rect x="110" y="325" width="180" height="90" rx="8" fill="url(#certGrad)" stroke="#b45309" stroke-width="3" />
    <rect x="115" y="330" width="170" height="80" rx="5" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2" />

    <!-- Certificate Header Emblem & Text Lines -->
    <circle cx="200" cy="342" r="7" fill="#0284c7" />
    <path d="M 200 338 L 202 342 L 206 342 L 203 345 L 204 349 L 200 346 L 196 349 L 197 345 L 194 342 L 198 342 Z" fill="#fef08a" />
    
    <!-- Certificate Title Lines (Abune Gorgorios School / የምስክር ወረቀት) -->
    <rect x="145" y="354" width="110" height="4" rx="2" fill="#0f172a" opacity="0.8" />
    <rect x="160" y="362" width="80" height="3" rx="1.5" fill="#475569" opacity="0.7" />

    <!-- Awarded to Kaleb Bereket (Gold Stamp) -->
    <circle cx="200" cy="380" r="11" fill="url(#goldGrad)" />
    <circle cx="200" cy="380" r="8" fill="none" stroke="#78350f" stroke-width="1" />
    <text x="200" y="383" font-size="7" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">★</text>
  </g>

  <!-- Owner Crown Badge (Master Platform Identity) -->
  <g id="owner-crown-badge" filter="drop-shadow(0px 3px 5px rgba(0,0,0,0.4))">
    <circle cx="340" cy="60" r="30" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Crown icon -->
    <path d="M 324 66 L 328 50 L 334 57 L 340 48 L 346 57 L 352 50 L 356 66 Z" fill="url(#goldGrad)" />
    <circle cx="328" cy="49" r="1.5" fill="#ffffff" />
    <circle cx="340" cy="47" r="1.8" fill="#ffffff" />
    <circle cx="352" cy="49" r="1.5" fill="#ffffff" />
    <!-- Little Banner -->
    <rect x="316" y="74" width="48" height="14" rx="7" fill="url(#goldGrad)" />
    <text x="340" y="84" font-size="8" font-weight="900" fill="#451a03" text-anchor="middle" font-family="sans-serif" letter-spacing="0.5">OWNER</text>
  </g>

  <!-- Bottom Tag "KALEB BEREKET" -->
  <g id="name-tag" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">
    <rect x="100" y="16" width="200" height="26" rx="13" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
    <text x="200" y="33" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">
      👑 KALEB BEREKET
    </text>
  </g>
</svg>
